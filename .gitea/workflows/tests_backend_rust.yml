name: Backend_Rust

on:
  push:
  pull_request:

jobs:
  test_rust:
    runs-on: ubuntu-26.04-arm
    container:
      image: cimg/rust:1.96-node
    defaults:
      run:
        working-directory: ./back_end_rust
    steps:
    - uses: actions/checkout@v6
    - name: Install tarpaulin
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin
    - name: Run Tests
      run: cargo tarpaulin -j 1 --out Html
    - name: Upload code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report-rust
        path: back_end_rust/tarpaulin-report.html
        retention-days: 7

  build_linux:
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    needs: test_rust
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        include:
          - name: linux-arm64-gnu
            container: rust:1.96-trixie
            package_manager: apt update && apt install -y
          - name: linux-arm64-musl
            container: rust:1.96-alpine3.22
            package_manager: apk add 

    container: ${{matrix.container}}

    steps:
      - name: Add node
        run: ${{matrix.package_manager}} nodejs
      - uses: actions/checkout@v6
      - name: Build Release
        run: cargo build --release
        working-directory: ./back_end_rust

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bike_calculator_backend-release-${{ matrix.name }}
          path: back_end_rust/target/release/bike_calculator_backend
          retention-days: 28
          overwrite: true


  build_docker:
    if: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
    needs: test_rust
    runs-on: ubuntu-26.04-arm
    container:
      image: docker
    permissions:
      contents: read
      packages: write

    steps:
    - name: Add node to executable
      run: apk add nodejs
    - uses: actions/checkout@v6

    - name: Log into container registry
      uses: docker/login-action@v4
      with:
        registry: git.rausch.com.au
        username: ${{ gitea.actor }}
        password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./back_end_rust
        file: ./back_end_rust/Dockerfile
        platforms: linux/arm64
        push: true
        tags: git.rausch.com.au/angusrausch/bikecalc_backend_rust:latest
