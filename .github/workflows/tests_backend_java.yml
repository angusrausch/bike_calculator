name: Backend_Tests_Java

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  test_java:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./back_end_java
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'
    - name: Build and Run Tests
      run: ./mvnw test
    - name: Upload code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report-java
        path: target/site/jacoco
        retention-days: 7