name: Backend_Tests_Node

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  test_node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back_end_node
    steps:
    - uses: actions/checkout@v6
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
    - name: Install NPM Packages
      run: |
        npm install
    - name: Run Tests
      run: |
        npm test
