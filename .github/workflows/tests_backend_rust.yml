name: Backend_Rust

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  test_rust:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./back_end_rust
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Install tarpaulin
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin
    - name: Run Tests
      run: cargo tarpaulin --out Html
    - name: Upload code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report-rust
        path: back_end_rust/tarpaulin-report.html
        retention-days: 7

  build_linux:
    needs: test_rust
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: x86_64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: aarch64-gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: x86_64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - name: aarch64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true

    defaults:
      run:
        working-directory: ./back_end_rust

    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Prepare musl toolchain (Ubuntu runners)
        if: ${{ matrix.musl == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc make pkg-config
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: bike_calculator_backend-release-${{ matrix.name }}
          path: back_end_rust/target/${{ matrix.target }}/release/bike_calculator_backend
          retention-days: 28
          overwrite: true

