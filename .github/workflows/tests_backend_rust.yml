name: Backend_Rust

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  test_rust:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./back_end_rust
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Install tarpaulin
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin
    - name: Run Tests
      run: cargo tarpaulin --out Html
    - name: Upload code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report-rust
        path: back_end_rust/tarpaulin-report.html
        retention-days: 7

  build_linux:
    needs: test_rust
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64-gnu
            runner: ubuntu-latest
            container: rust:1.95-trixie
          - name: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            container: rust:1.95-trixie
          - name: linux-x86_64-musl
            runner: ubuntu-latest
            container: rust:1.95-alpine3.22
          # No Arm musl due to actions not having an upload artifact for Arm Alpine
          # - name: linux-arm64-musl
          #   runner: ubuntu-24.04-arm64
          #   container: rust:1.95-alpine3.22

    container: ${{ matrix.container }}
    defaults:
      run:
        working-directory: ./back_end_rust

    steps:
      - uses: actions/checkout@v6
      - name: Build Release
        run: cargo build --release
      
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bike_calculator_backend-release-${{ matrix.name }}
          path: back_end_rust/target/release/bike_calculator_backend
          retention-days: 28
          overwrite: true
