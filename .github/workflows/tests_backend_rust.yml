name: Backend_Rust

on:
  push:
  pull_request:

jobs:
  test_rust:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./back_end_rust
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Install tarpaulin
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-tarpaulin
    - name: Run Tests
      run: cargo tarpaulin --out Html
    - name: Upload code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report-rust
        path: back_end_rust/tarpaulin-report.html
        retention-days: 7

  build_linux:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test_rust
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: linux-x86_64-gnu
            runner: ubuntu-latest
            container: rust:1.95-trixie
          - name: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            container: rust:1.95-trixie
          - name: linux-x86_64-musl
            runner: ubuntu-latest
            container: rust:1.95-alpine3.22
          # No Arm musl due to actions not having an upload artifact for Arm Alpine
          # - name: linux-arm64-musl
          #   runner: ubuntu-24.04-arm64
          #   container: rust:1.95-alpine3.22

    container: ${{ matrix.container }}
    defaults:
      run:
        working-directory: ./back_end_rust

    steps:
      - uses: actions/checkout@v6
      - name: Build Release
        run: cargo build --release
      
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bike_calculator_backend-release-${{ matrix.name }}
          path: back_end_rust/target/release/bike_calculator_backend
          retention-days: 28
          overwrite: true

  build_docker:
    # if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test_rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Log into container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./back_end_rust
        file: ./back_end_rust/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/angusrausch/back_end_rust:latest