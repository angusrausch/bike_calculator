name: Backend_Python_Test_and_Build

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  test_python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back_end_python
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        cache: 'pip'
    - name: Install Pip Packages
      run: |
        pip3 install -r requirements.txt
        pip3 install -e .
    - name: Setup Fake Environment
      run: mv .env.example .env
    - name: Run Tests
      run: |
        coverage run -m pytest
        coverage html
    - name: Upload code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report-python
        path: back_end_python/htmlcov
        retention-days: 7

  build_docker:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: test_python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Log into container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./back_end_python
        file: ./back_end_python/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/angusrausch/bikecalc_backend_python:latest