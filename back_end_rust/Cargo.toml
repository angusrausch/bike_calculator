[package]
name = "back_end_rust"
version = "0.1.0"
edition = "2024"

dotenvy = "0.15"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.2", features = ["full"] }
sea-orm = { version = "1.0", features = [
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros"
] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tower-http = { version = "0.6.10", features = ["cors"] }
http = "1.4.0"
axum-test = "20.0.0"
urlencoding = "2.1.3"
approx = "0.5.1"
reqwest = "0.13.3"
